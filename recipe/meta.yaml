{% set name = "pipenv" %}
{% set version = "2026.7.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/pypa/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 539d3f5be93e169bbe4ca35135624850a5a5ce7a764adf97eb6b4d898d656b1a

build:
  number: 0
  entry_points:
    - pipenv=pipenv:cli
    - pipenv-resolver=pipenv.resolver:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - setuptools >=67
  run:
    - python
    - certifi
    - packaging >=22
    # setuptools is a part of run dependency https://github.com/pypa/pipenv/blob/v2026.7.1/pyproject.toml#L31
    - setuptools >=67
    - virtualenv >=20.26.6
  run_constrained:
    - safety >=3.0.0
    - argcomplete >=3.1

{% set tests_to_skip = "test_resolver_subprocess_happy_path_returns_success_with_stubbed_resolver" %}

test:
  source_files:
    - tests
    - tasks
  imports:
    - pipenv
    - pipenv.cli
    - pipenv.patched
    - pipenv.routines
    - pipenv.utils
    - pipenv.vendor
  requires:
    - pip
    - pytest >=5
    - pytz
    - invoke
    - semver
    - bs4
    - requests
  commands:
    - pipenv --help
    - pip check
    - pytest -v tests/unit -k "not ({{ tests_to_skip }})"
    # Basic pipenv usage tested manually, works properly

about:
  home: https://github.com/pypa/pipenv
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python Development Workflow for Humans.
  description: |
    Pipenv is a tool that aims to bring the best of all packaging worlds (bundler, composer,
    npm, cargo, yarn, etc.) to the Python world.
  doc_url: https://pipenv.pypa.io
  dev_url: https://github.com/pypa/pipenv

extra:
  recipe-maintainers:
    - drewgilliam
    - roccqqck  
