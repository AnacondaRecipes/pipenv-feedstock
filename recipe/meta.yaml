{% set name = "pipenv" %}
{% set version = "2026.6.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/pypa/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 23991bed64882e39a21cdfb8085ee2c6188d7649556446904c64cffb2ee8d411

build:
  number: 0
  entry_points:
    - pipenv=pipenv:cli
    - pipenv-resolver=pipenv.resolver:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - setuptools >=67
  run:
    - python
    - certifi
    - packaging >=22
    # setuptools is a part of run dependency https://github.com/pypa/pipenv/blob/v2025.0.4/pyproject.toml#L31
    - setuptools >=67
    - virtualenv >=20.24.2
  run_constrained:
    - safety >=3.0.0

test:
  source_files:
    - tests
  imports:
    - pipenv
    - pipenv.cli
    - pipenv.patched
    - pipenv.routines
    - pipenv.utils
    - pipenv.vendor
  requires:
    - pip
    - pytest >=5
    - pytz
  commands:
    - python -c "import pipenv"
    - pipenv --help
    - pip check
    - pytest -v tests/unit
    # Basic pipenv usage tested manually, works properly

about:
  home: https://github.com/pypa/pipenv
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python Development Workflow for Humans.
  description: |
    Pipenv is a tool that aims to bring the best of all packaging worlds (bundler, composer,
    npm, cargo, yarn, etc.) to the Python world.
  doc_url: https://pipenv.pypa.io
  dev_url: https://github.com/pypa/pipenv

extra:
  recipe-maintainers:
    - drewgilliam
    - roccqqck
